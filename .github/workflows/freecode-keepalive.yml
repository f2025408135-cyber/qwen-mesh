name: freecode-keepalive

on:
  schedule:
    - cron: "30 */10 * * *"   # every 10h, offset from hf-keepalive
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FreeCode router sidecar (keeps space awake + router warm)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://oxmoiz-qwen-mesh-agent.hf.space/healthz)
          echo "healthz: $code"
          [ "$code" = "200" ] || { echo "SPACE NOT ALIVE (code $code)"; exit 1; }

      - name: Verify router /v1/models (spawns sidecar if needed)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sleep 10
          body=$(curl -s -H "Authorization: Bearer $HF_TOKEN" \
            https://oxmoiz-qwen-mesh-agent.hf.space/v1/models)
          echo "$body" | head -c 400; echo
          echo "$body" | grep -q nemotron-3-ultra-free || { echo "ROUTER MODELS MISSING"; exit 1; }
          echo "freecode router: models OK"