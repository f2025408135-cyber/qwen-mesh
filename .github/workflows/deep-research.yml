name: deep-research

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Fully-specified research topic (scoping template — skip clarifying questions)'
        required: true
        type: string
      focus:
        description: 'technical | industry | practical (optional)'
        required: false
        type: string
        default: ''
      audience:
        description: 'Reader level (optional)'
        required: false
        type: string
        default: ''
      max_wait_seconds:
        description: 'Max seconds to wait for the report (default 1500)'
        required: false
        type: string
        default: '1500'
      account_index:
        description: 'Qwen account/pod index 1-5 (one dispatch per account for parallel waves)'
        required: false
        type: string
        default: '1'
      mode:
        description: 'spike = login+WAF probe only | research = full deep research'
        required: false
        type: string
        default: 'research'
      os:
        description: 'Runner OS — macos-latest uses GitHub macOS cloud IPs (NOT Azure; dodges IP-range blocks)'
        required: false
        type: string
        default: 'ubuntu-latest'
      headed:
        description: '1 = headed chrome under xvfb (defeats headless fingerprints)'
        required: false
        type: string
        default: '0'
      chat_id:
        description: 'HYBRID MODE: existing research chat id (mode=collect polls + collects it)'
        required: false
        type: string
        default: ''

concurrency:
  group: qwen-account-${{ github.event.inputs.account_index }}
  cancel-in-progress: false

jobs:
  pod:
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache chromium (playwright)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: qwen-mesh-chromium-v2

      - name: Install chromium
        run: npx -y playwright install --with-deps chromium

      - name: Install xvfb (headed mode)
        if: github.event.inputs.headed == '1' && runner.os == 'Linux'
        run: which xvfb-run >/dev/null 2>&1 || sudo apt-get install -y xvfb

      - name: Run remote pod
        env:
          QWEN_JWT_1: ${{ secrets.QWEN_JWT_1 }}
          QWEN_JWT_2: ${{ secrets.QWEN_JWT_2 }}
          QWEN_JWT_3: ${{ secrets.QWEN_JWT_3 }}
          QWEN_JWT_4: ${{ secrets.QWEN_JWT_4 }}
          QWEN_JWT_5: ${{ secrets.QWEN_JWT_5 }}
          QWEN_JWT_6: ${{ secrets.QWEN_JWT_6 }}
          QWEN_JWT_7: ${{ secrets.QWEN_JWT_7 }}
          QWEN_JWT_8: ${{ secrets.QWEN_JWT_8 }}
          QWEN_JWT_9: ${{ secrets.QWEN_JWT_9 }}
          QWEN_JWT_10: ${{ secrets.QWEN_JWT_10 }}
          QWEN_JWT_11: ${{ secrets.QWEN_JWT_11 }}
          QWEN_JWT_12: ${{ secrets.QWEN_JWT_12 }}
          QWEN_JWT_13: ${{ secrets.QWEN_JWT_13 }}
          QWEN_JWT_14: ${{ secrets.QWEN_JWT_14 }}
          QWEN_JWT_15: ${{ secrets.QWEN_JWT_15 }}
          QWEN_JWT_16: ${{ secrets.QWEN_JWT_16 }}
          QWEN_JWT_17: ${{ secrets.QWEN_JWT_17 }}
          QWEN_JWT_18: ${{ secrets.QWEN_JWT_18 }}
          QWEN_JWT_19: ${{ secrets.QWEN_JWT_19 }}
          QWEN_JWT_20: ${{ secrets.QWEN_JWT_20 }}
          QWEN_JWT_21: ${{ secrets.QWEN_JWT_21 }}
          QWEN_JWT_22: ${{ secrets.QWEN_JWT_22 }}
          QWEN_JWT_23: ${{ secrets.QWEN_JWT_23 }}
          QWEN_JWT_24: ${{ secrets.QWEN_JWT_24 }}
          QWEN_JWT_25: ${{ secrets.QWEN_JWT_25 }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_FOCUS: ${{ github.event.inputs.focus }}
          INPUT_AUDIENCE: ${{ github.event.inputs.audience }}
          INPUT_MAX_WAIT_SECONDS: ${{ github.event.inputs.max_wait_seconds }}
          INPUT_ACCOUNT_INDEX: ${{ github.event.inputs.account_index }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_HEADED: ${{ github.event.inputs.headed }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          if [ "${{ github.event.inputs.headed }}" = "1" ]; then
            xvfb-run -a node runner/deep-research.mjs
          else
            node runner/deep-research.mjs
          fi

      - name: Step summary
        if: always()
        run: |
          if [ -f out/result.json ]; then
            echo "### qwen-mesh pod result" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Deliver the proprietary report to the PRIVATE repo (never public).
      # Only runs when a report actually exists (research/collect modes success).
      - name: Deliver to private repo
        if: success() && hashFiles('out/report.md') != ''
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
          ACCT_INDEX: ${{ github.event.inputs.account_index }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          if [ -z "$PRIVATE_REPO_TOKEN" ] || [ -z "$PRIVATE_REPO_NAME" ]; then
            echo "::warning::PRIVATE_REPO_TOKEN/PRIVATE_REPO_NAME not set — skipping private delivery"
            exit 0
          fi
          SLUG="${PRIVATE_REPO_NAME#*/}"
          git config --global user.email "qwen-mesh@users.noreply.github.com"
          git config --global user.name "qwen-mesh"
          rm -rf ./qwen-research
          git clone --quiet --depth 1 "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO_NAME}.git" ./qwen-research
          TS="$(date +%Y%m%d-%H%M%S)"
          mkdir -p ./qwen-research/reports
          cp "out/report.md" "./qwen-research/reports/qwen-research-${TS}-acct${ACCT_INDEX}.md"
          if [ -f "out/report.pdf" ]; then
            cp "out/report.pdf" "./qwen-research/reports/qwen-research-${TS}-acct${ACCT_INDEX}.pdf"
          fi
          cp "out/result.json" "./qwen-research/reports/qwen-research-${TS}-acct${ACCT_INDEX}.result.json"
          cd ./qwen-research
          git add reports/
          git commit --quiet -m "deep research acct${ACCT_INDEX} run ${RUN_ID} @ ${TS}"
          git push --quiet origin HEAD
          echo "DELIVERED to private repo: reports/qwen-research-${TS}-acct${ACCT_INDEX}.md"

      # Public artifact: metadata ONLY (result.json) — never the report body.
      - name: Upload metadata artifact
        if: always() && hashFiles('out/result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ github.run_id }}
          path: out/result.json
          retention-days: 30